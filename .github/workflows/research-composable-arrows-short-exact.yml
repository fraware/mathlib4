name: Composable arrows ShortExact cleanup

on:
  push:
    branches:
      - research/2026-09-29-composable-arrows-short-exact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short:
    runs-on: ubuntu-latest
    env:
      BASE: ed72f1faaeee9bea5805932ae309af92264cd8d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify cleanup scope
        run: |
          git diff --check "$BASE"...HEAD
          test "$(git diff --name-only "$BASE"...HEAD -- Mathlib | wc -l)" = 4
          git diff --name-only "$BASE"...HEAD -- Mathlib | grep -Fx "Mathlib/Algebra/Homology/ExactSequence.lean"
          git diff --name-only "$BASE"...HEAD -- Mathlib | grep -Fx "Mathlib/Algebra/Homology/HomologySequence.lean"
          git diff --name-only "$BASE"...HEAD -- Mathlib | grep -Fx "Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean"
          git diff --name-only "$BASE"...HEAD -- Mathlib | grep -Fx "Mathlib/CategoryTheory/ComposableArrows/Basic.lean"
          ! grep -F 'dsimproc ↓ reduceObj' Mathlib/CategoryTheory/ComposableArrows/Basic.lean
          test "$(grep -cF 'dsimproc reduceMap' Mathlib/CategoryTheory/ComposableArrows/Basic.lean)" = 1
          ! grep -F 'attribute [-simp] Fin.reduceFinMk' Mathlib/CategoryTheory/ComposableArrows/Basic.lean
          ! grep -F '27382' Mathlib/Algebra/Homology/ExactSequence.lean
          ! grep -F -- '-Fin.reduceFinMk' Mathlib/Algebra/Homology/ExactSequence.lean
          ! grep -F '27382' Mathlib/Algebra/Homology/HomologySequence.lean
          ! grep -F -- '-Fin.reduceFinMk' Mathlib/Algebra/Homology/HomologySequence.lean
          ! grep -F '27382' Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean
          ! grep -F -- '-Fin.reduceFinMk' Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean
          git diff --exit-code "$BASE"...HEAD -- Mathlib/CategoryTheory/Abelian/DiagramLemmas/Four.lean
          git diff --exit-code "$BASE"...HEAD -- Mathlib/CategoryTheory/Sites/SheafCohomology/MayerVietoris.lean
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build affected modules
        run: lake build Mathlib.CategoryTheory.ComposableArrows.Basic Mathlib.Algebra.Homology.ExactSequence Mathlib.Algebra.Homology.HomologySequence Mathlib.Algebra.Homology.HomotopyCategory.ShortExact
