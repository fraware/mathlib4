name: Composable arrows full validation

on:
  push:
    branches:
      - research/2026-09-03-composable-arrows-four-simp-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Apply integrated candidate
        run: |
          python3 scripts/research_composable_arrows_four_simp.py
          git diff --check
          if git grep -n '27382\|\[-Fin.reduceFinMk\]\|attribute \[-simp\] Fin.reduceFinMk' -- \
            Mathlib/CategoryTheory/ComposableArrows/Basic.lean \
            Mathlib/CategoryTheory/Abelian/DiagramLemmas/Four.lean \
            Mathlib/Algebra/Homology/ExactSequence.lean \
            Mathlib/Algebra/Homology/HomologySequence.lean \
            Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean; then
            echo 'stale composable-arrows workaround remains' >&2
            exit 1
          fi
      - name: Build full library and regression probe
        run: |
          lake build Mathlib
          lake build MathlibTest.ComposableArrowsIntegratedProbe
