name: Composable arrows ExactSequence cleanup

on:
  push:
    branches:
      - research/2026-09-29-composable-arrows-exact-sequence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    env:
      BASE: ed72f1faaeee9bea5805932ae309af92264cd8d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify cleanup scope
        run: |
          git diff --check "$BASE"...HEAD
          printf '%s
' "$(git diff --name-only "$BASE"...HEAD -- Mathlib | sort)" | diff -u - <(printf '%s
'             "Mathlib/Algebra/Homology/ExactSequence.lean"             "Mathlib/CategoryTheory/ComposableArrows/Basic.lean")
          ! grep -F 'dsimproc ↓ reduceObj' Mathlib/CategoryTheory/ComposableArrows/Basic.lean
          test "$(grep -cF 'dsimproc reduceMap' Mathlib/CategoryTheory/ComposableArrows/Basic.lean)" = 1
          ! grep -F 'attribute [-simp] Fin.reduceFinMk' Mathlib/CategoryTheory/ComposableArrows/Basic.lean
          ! grep -F '27382' Mathlib/Algebra/Homology/ExactSequence.lean
          ! grep -F -- '-Fin.reduceFinMk' Mathlib/Algebra/Homology/ExactSequence.lean
          git diff --exit-code "$BASE"...HEAD --             Mathlib/Algebra/Homology/HomologySequence.lean             Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean             Mathlib/CategoryTheory/Abelian/DiagramLemmas/Four.lean             Mathlib/CategoryTheory/Sites/SheafCohomology/MayerVietoris.lean
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Basic and ExactSequence
        run: lake build Mathlib.CategoryTheory.ComposableArrows.Basic Mathlib.Algebra.Homology.ExactSequence
