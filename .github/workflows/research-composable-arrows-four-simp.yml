name: Composable arrows Four simp research

on:
  push:
    branches:
      - research/2026-09-03-composable-arrows-four-simp-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Apply candidate
        run: |
          python3 scripts/research_composable_arrows_four_simp.py
          git diff --check
      - name: Build discriminator
        run: |
          lake build \
            Mathlib.CategoryTheory.ComposableArrows.Basic \
            Mathlib.CategoryTheory.Abelian.DiagramLemmas.Four \
            Mathlib.Algebra.Homology.ExactSequence \
            Mathlib.Algebra.Homology.HomologySequence \
            Mathlib.Algebra.Homology.HomotopyCategory.ShortExact \
            MathlibTest.ComposableArrowsIntegratedProbe
