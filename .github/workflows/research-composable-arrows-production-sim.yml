name: Composable arrows production simulation

on:
  push:
    branches:
      - research/2026-09-03-composable-arrows-production-sim
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Apply production-shape experiment
        run: |
          python3 scripts/research_composable_arrows_production_sim.py
          git diff --check
          git diff -- Mathlib/CategoryTheory/ComposableArrows/Basic.lean Mathlib/Algebra/Homology/ExactSequence.lean Mathlib/Algebra/Homology/HomologySequence.lean Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean
      - name: Build production candidate and affected consumers
        run: |
          lake build \
            Mathlib.CategoryTheory.ComposableArrows.Basic \
            Mathlib.Algebra.Homology.ExactSequence \
            Mathlib.Algebra.Homology.HomologySequence \
            Mathlib.Algebra.Homology.HomotopyCategory.ShortExact \
            MathlibTest.ComposableArrowsProductionProbe
