name: Composable arrows canonical Fin expression research

on:
  push:
    branches:
      - research/2026-09-04-composable-arrows-toexpr-fin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Apply canonical Fin candidate
        run: |
          python3 scripts/research_composable_arrows_toexpr_fin.py
          git diff --check
          if git grep -n '27382\|\[-Fin.reduceFinMk\]\|attribute \[-simp\] Fin.reduceFinMk' -- \
            Mathlib/CategoryTheory/ComposableArrows/Basic.lean \
            Mathlib/CategoryTheory/Abelian/DiagramLemmas/Four.lean \
            Mathlib/Algebra/Homology/ExactSequence.lean \
            Mathlib/Algebra/Homology/HomologySequence.lean \
            Mathlib/Algebra/Homology/HomotopyCategory/ShortExact.lean; then
            echo 'stale composable-arrows workaround remains' >&2
            exit 1
          fi
          if grep -n 'mkFinCtor' Mathlib/CategoryTheory/ComposableArrows/Basic.lean; then
            echo 'manual Fin constructor helper remains' >&2
            exit 1
          fi
      - name: Build affected modules and regression probe
        run: |
          lake build \
            Mathlib.CategoryTheory.ComposableArrows.Basic \
            Mathlib.CategoryTheory.Abelian.DiagramLemmas.Four \
            Mathlib.Algebra.Homology.ExactSequence \
            Mathlib.Algebra.Homology.HomologySequence \
            Mathlib.Algebra.Homology.HomotopyCategory.ShortExact \
            Mathlib.CategoryTheory.Sites.SheafCohomology.MayerVietoris \
            MathlibTest.ComposableArrowsIntegratedProbe
