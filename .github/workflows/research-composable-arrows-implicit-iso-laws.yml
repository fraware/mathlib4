name: Composable arrows implicit iso laws research

on:
  push:
    branches:
      - research/2026-09-04-composable-arrows-implicit-iso-laws
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Apply candidate without explicit iso laws
        run: |
          python3 scripts/research_composable_arrows_implicit_iso_laws.py
          git diff --check
      - name: Build Basic
        run: lake build Mathlib.CategoryTheory.ComposableArrows.Basic
